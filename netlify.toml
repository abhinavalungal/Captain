[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/**"]

# Pull Veson + Geoform data into Postgres every hour. Captain answers from the
# synced tables; it never calls the upstream APIs during a conversation.
[functions."captain-sync"]
  schedule = "@hourly"
